name: Publish Linux beta
on:
  push:
    tags: ['v[0-9]*-beta.*']
permissions:
  contents: write
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      deb_version: ${{ steps.version.outputs.deb_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify beta tag is on main and choose Debian version
        id: version
        run: |
          git merge-base --is-ancestor HEAD origin/main
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(sed -n "s/^VERSION = '\(.*\)'/\1/p" client/main.py)"
          echo "deb_version=${version/-beta./~beta.}" >> "$GITHUB_OUTPUT"
  validate:
    needs: version
    uses: ./.github/workflows/tests.yml
    with:
      deb_version: ${{ needs.version.outputs.deb_version }}
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: steam-personal-cloud-ubuntu-client
          path: dist
      - name: Publish compiled beta and corresponding third-party sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -c ./*.sha256)
          sed "s|(README.md)|(https://github.com/improper/steam-personal-cloud/blob/$GITHUB_REF_NAME/README.md)|g" CHANGELOG.md > /tmp/release-notes.md
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > /tmp/release-draft; then
            test "$(cat /tmp/release-draft)" = true
            gh release upload "$GITHUB_REF_NAME" dist/*.deb dist/*.sha256 dist/*.tar --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.sha256 dist/*.tar \
              --verify-tag --draft --prerelease --title "Steam Personal Cloud $GITHUB_REF_NAME" \
              --notes-file /tmp/release-notes.md
          fi
          find dist -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/expected-assets
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort > /tmp/uploaded-assets
          diff -u /tmp/expected-assets /tmp/uploaded-assets
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease \
            --title "Steam Personal Cloud $GITHUB_REF_NAME" --notes-file /tmp/release-notes.md
